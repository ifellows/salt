# nginx site configuration for the SALT documentation website.
#
# Drop this file in /etc/nginx/sites-available/surveysalt and symlink to
# /etc/nginx/sites-enabled/surveysalt. Then run:
#
#   certbot --nginx -d docs.your-domain.example.org -m admin@example.org --agree-tos --non-interactive
#
# Adjust the server_name and root path to match your environment.

server {
    listen 80;
    listen [::]:80;
    server_name docs.your-domain.example.org;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docs.your-domain.example.org;

    # TLS — managed by certbot; paths filled in by certbot automatically
    ssl_certificate     /etc/letsencrypt/live/docs.your-domain.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.your-domain.example.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Static site root — copy dist/ here after running ./deploy.sh
    root /var/www/salt-docs;
    index index.html;

    # Serve pre-compressed assets if available
    gzip_static on;

    # Astro static site — all routes are pre-rendered HTML files
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/salt-docs-access.log;
    error_log  /var/log/nginx/salt-docs-error.log;
}
